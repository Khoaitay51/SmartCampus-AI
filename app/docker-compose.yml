services:
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcampus-ai
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      AGENT: ${AGENT:-gemini-3.6-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://smartcampus:change-this-local-password@host.docker.internal:5432/smartcampus}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8000}
      BACKEND_SERVICE_TOKEN: ${BACKEND_SERVICE_TOKEN:-}
      AUDIT_OUTPUT_DIR: ${AUDIT_OUTPUT_DIR:-/app/output}
      EVALUATE_TIMEOUT_SECONDS: ${EVALUATE_TIMEOUT_SECONDS:-25}
      MAX_REACT_STEP: ${MAX_REACT_STEP:-6}
      MAX_REFLECT_STEP: ${MAX_REFLECT_STEP:-3}
      MAX_RAG_CALLS: ${MAX_RAG_CALLS:-5}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.5}
    ports:
      - "${AI_PORT:-8001}:8000"
    volumes:
      - .:/app
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]