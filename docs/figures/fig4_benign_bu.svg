<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>BU trên 100 ca benign, tách ca cần hành động và ca không cần hành động</title>
  <style>
    .t1{font-size:13px;fill:#0b0b0b}
    .t2{font-size:11.5px;fill:#52514e}
    .tb{font-size:14px;font-weight:700;fill:#0b0b0b}
    .grid{stroke:#e4e3df;stroke-width:1}
    .link{stroke:#b9b8b2;stroke-width:2}
  </style>
  <rect width="900" height="330" fill="#fcfcfb"/>

  <!-- chú giải -->
  <circle cx="226" cy="30" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <text x="238" y="34" class="t1">Ca cần hành động bảo vệ (40 ca)</text>
  <rect x="470" y="24" width="12" height="12" rx="2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="490" y="34" class="t1">Ca không cần hành động (60 ca)</text>
  <text x="840" y="62" class="t2" text-anchor="middle">BU</text>
  <text x="840" y="76" class="t2" text-anchor="middle">(100 ca)</text>

  <!-- lưới: x(v) = 220 + (v-50)*10.8 -->
  <g class="grid">
    <line x1="220" y1="84" x2="220" y2="290"/><line x1="328" y1="84" x2="328" y2="290"/>
    <line x1="436" y1="84" x2="436" y2="290"/><line x1="544" y1="84" x2="544" y2="290"/>
    <line x1="652" y1="84" x2="652" y2="290"/><line x1="760" y1="84" x2="760" y2="290"/>
  </g>
  <g class="t2" text-anchor="middle">
    <text x="220" y="308">50%</text><text x="328" y="308">60%</text><text x="436" y="308">70%</text>
    <text x="544" y="308">80%</text><text x="652" y="308">90%</text><text x="760" y="308">100%</text>
  </g>

  <!-- Gemini: prot 90, safe 95, BU 93 -->
  <text x="20" y="112" class="t1">Gemini 3.5 flash-lite</text>
  <line x1="652" y1="108" x2="706" y2="108" class="link"/>
  <circle cx="652" cy="108" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <rect x="700" y="102" width="12" height="12" rx="2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="640" y="112" class="t2" text-anchor="end">90</text>
  <text x="840" y="113" class="tb" text-anchor="middle">93.0</text>

  <!-- GPT-6 luna: prot 82.5, safe 98.3, BU 92 -->
  <text x="20" y="152" class="t1">GPT-6 luna</text>
  <line x1="571" y1="148" x2="742" y2="148" class="link"/>
  <circle cx="571" cy="148" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <rect x="736" y="142" width="12" height="12" rx="2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="559" y="152" class="t2" text-anchor="end">82.5</text>
  <text x="840" y="153" class="tb" text-anchor="middle">92.0</text>

  <!-- DeepSeek: prot 80, safe 100, BU 92 -->
  <text x="20" y="192" class="t1">DeepSeek flash</text>
  <line x1="544" y1="188" x2="760" y2="188" class="link"/>
  <circle cx="544" cy="188" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <rect x="754" y="182" width="12" height="12" rx="2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="532" y="192" class="t2" text-anchor="end">80</text>
  <text x="840" y="193" class="tb" text-anchor="middle">92.0</text>

  <!-- GLM: prot 67.5, safe 98.3, BU 86 -->
  <text x="20" y="232" class="t1">GLM 5.3 flash</text>
  <line x1="409" y1="228" x2="742" y2="228" class="link"/>
  <circle cx="409" cy="228" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <rect x="736" y="222" width="12" height="12" rx="2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="397" y="232" class="t2" text-anchor="end">67.5</text>
  <text x="840" y="233" class="tb" text-anchor="middle">86.0</text>

  <!-- Haiku: prot 62.5, safe 98.3, BU 84 -->
  <text x="20" y="272" class="t1">Claude Haiku 5.5</text>
  <line x1="355" y1="268" x2="742" y2="268" class="link"/>
  <circle cx="355" cy="268" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
  <rect x="736" y="262" width="12" height="12" rx="2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="343" y="272" class="t2" text-anchor="end">62.5</text>
  <text x="840" y="273" class="tb" text-anchor="middle">84.0</text>
</svg>
